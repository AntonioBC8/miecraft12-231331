    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Prevent "Cannot set property fetch of #<Window> which has only a getter" in strict sandbox iframes
      (function() {
        try {
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') || Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
          if (desc && !desc.set) {
            var origFetch = window.fetch ? window.fetch.bind(window) : null;
            Object.defineProperty(window, 'fetch', {
              get: function() { return origFetch; },
              set: function(fn) { origFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // fallback
        }
      })();
    </script>
